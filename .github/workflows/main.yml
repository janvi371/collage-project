name: Build
on:
  workflow_dispatch:
    inputs:
      ubuntu_latest:
        description: 'Linux / Ubuntu latest (24.04 today) - label moves later'
        type: boolean
        default: false
      ubuntu_24_04:
        description: 'Linux / Ubuntu 24.04 - no end date yet'
        type: boolean
        default: true
      ubuntu_22_04:
        description: 'Linux / Ubuntu 22.04 - ends 17 Apr 2027'
        type: boolean
        default: false
      ubuntu_26_04:
        description: 'Linux / Ubuntu 26.04 (preview) - no end date yet'
        type: boolean
        default: false
      ubuntu_24_04_arm:
        description: 'Linux / Ubuntu 24.04 ARM64 - no end date yet'
        type: boolean
        default: false
      ubuntu_22_04_arm:
        description: 'Linux / Ubuntu 22.04 ARM64 - ends 17 Apr 2027'
        type: boolean
        default: false
      ubuntu_26_04_arm:
        description: 'Linux / Ubuntu 26.04 ARM64 (preview) - no end date yet'
        type: boolean
        default: false
      windows_latest:
        description: 'Windows / Server 2025 (latest) - no end date yet'
        type: boolean
        default: false
      windows_2025:
        description: 'Windows / Server 2025 (same machine as latest) - no end date yet'
        type: boolean
        default: false
      windows_2022:
        description: 'Windows / Server 2022 - no end date yet'
        type: boolean
        default: false
      windows_11_arm:
        description: 'Windows / 11 ARM64 - no end date yet'
        type: boolean
        default: false
      macos_latest:
        description: 'macOS / latest (26 today, Apple Silicon) - label moves later'
        type: boolean
        default: false
      macos_26:
        description: 'macOS / 26 Apple Silicon - no end date yet'
        type: boolean
        default: false
      macos_15:
        description: 'macOS / 15 Apple Silicon - no end date yet'
        type: boolean
        default: false
      macos_14:
        description: 'macOS / 14 Apple Silicon - ends 2 Nov 2026'
        type: boolean
        default: false
      macos_26_intel:
        description: 'macOS / 26 Intel - no end date yet'
        type: boolean
        default: false
      macos_15_intel:
        description: 'macOS / 15 Intel - no end date yet'
        type: boolean
        default: false
permissions: {}
jobs:
  select-os:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      linux: ${{ steps.pick.outputs.linux }}
      windows: ${{ steps.pick.outputs.windows }}
      macos: ${{ steps.pick.outputs.macos }}
    steps:
      - id: pick
        env:
          INPUTS: ${{ toJSON(inputs) }}
        run: |
          python3 - << 'PY'
          import json, os
          labels = {
              "ubuntu_latest": "ubuntu-latest",
              "ubuntu_24_04": "ubuntu-24.04",
              "ubuntu_22_04": "ubuntu-22.04",
              "ubuntu_26_04": "ubuntu-26.04",
              "ubuntu_24_04_arm": "ubuntu-24.04-arm",
              "ubuntu_22_04_arm": "ubuntu-22.04-arm",
              "ubuntu_26_04_arm": "ubuntu-26.04-arm",
              "windows_latest": "windows-latest",
              "windows_2025": "windows-2025",
              "windows_2022": "windows-2022",
              "windows_11_arm": "windows-11-arm",
              "macos_latest": "macos-latest",
              "macos_26": "macos-26",
              "macos_15": "macos-15",
              "macos_14": "macos-14",
              "macos_26_intel": "macos-26-intel",
              "macos_15_intel": "macos-15-intel",
          }
          ticked = json.loads(os.environ["INPUTS"])
          picked = [labels[k] for k, v in ticked.items() if k in labels and v in (True, "true")] or ["ubuntu-24.04"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              for output, prefix in (("linux", "ubuntu"), ("windows", "windows"), ("macos", "macos")):
                  out.write(output + "=" + json.dumps([x for x in picked if x.startswith(prefix)]) + "\n")
          PY
  linux:
    needs: select-os
    if: needs.select-os.outputs.linux != '[]'
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.select-os.outputs.linux) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    env:
      OS_LABEL: ${{ matrix.os }}
      RUN_PASSWORD: ${{ secrets.RUN_PASSWORD }}
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_CLIENT_SECRET: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
    steps:
      - name: build
        shell: bash
        run: |
          if [ "${#RUN_PASSWORD}" -lt 12 ]; then echo "::error::RUN_PASSWORD must be set and at least 12 characters"; exit 1; fi
          RD_TAG=$(curl -fsSIL -o /dev/null -w '%{url_effective}' https://github.com/rustdesk/rustdesk/releases/latest || true)
          RD_TAG=${RD_TAG##*/}
          case "$RD_TAG" in [0-9]*.[0-9]*.[0-9]*) ;; *) RD_TAG=1.5.0 ;; esac
          curl -fsSL -o /tmp/rustdesk.deb "https://github.com/rustdesk/rustdesk/releases/download/$RD_TAG/rustdesk-$RD_TAG-$(uname -m).deb" \
            || { echo "::error::Could not download RustDesk $RD_TAG"; exit 1; }
          sudo ufw allow from 100.64.0.0/10 to any port 21118 proto tcp
          sudo ufw --force enable
          sudo apt-get -o Acquire::Retries=3 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y --no-install-recommends cinnamon gnome-terminal xvfb libgl1-mesa-dri librsvg2-common adwaita-icon-theme dbus dbus-x11 dbus-user-session /tmp/rustdesk.deb
          sudo systemctl disable --now rustdesk || true
          sudo useradd -m -s /bin/bash run
          printf '%s\n' "run:$RUN_PASSWORD" | sudo chpasswd
          sudo usermod -aG sudo run
          sudo install -d -m 1777 /tmp/.X11-unix
          sudo install -d -o run -g run -m 700 /tmp/xdg-run
          UENV=(HOME=/home/run USER=run LOGNAME=run SHELL=/bin/bash LANG=C.UTF-8 PATH="$PATH" XDG_RUNTIME_DIR=/tmp/xdg-run XDG_SESSION_TYPE=x11 DISPLAY=:99)
          sudo -u run env -i "${UENV[@]}" Xvfb :99 -screen 0 1280x720x24 -nolisten tcp > /tmp/xvfb.log 2>&1 &
          for i in $(seq 1 30); do if [ -S /tmp/.X11-unix/X99 ]; then break; fi; sleep 1; done
          if [ ! -S /tmp/.X11-unix/X99 ]; then echo "::error::Xvfb did not start"; cat /tmp/xvfb.log; exit 1; fi
          DBUS=$(sudo -u run env -i "${UENV[@]}" dbus-daemon --session --fork --print-address)
          if [ -z "$DBUS" ]; then echo "::error::D-Bus session did not start"; exit 1; fi
          UENV+=(DBUS_SESSION_BUS_ADDRESS="$DBUS")
          sudo -u run env -i "${UENV[@]}" cinnamon-session-cinnamon > /tmp/cinnamon.log 2>&1 &
          DESKTOP_UP=no
          for i in $(seq 1 60); do if [ "$(sudo -u run env -i "${UENV[@]}" gdbus call --session --dest org.Cinnamon --object-path /org/Cinnamon --method org.Cinnamon.GetRunState 2>/dev/null || true)" = "(2,)" ]; then DESKTOP_UP=yes; break; fi; sleep 3; done
          if [ "$DESKTOP_UP" != yes ]; then echo "::error::Cinnamon did not start"; tail -n 40 /tmp/cinnamon.log; exit 1; fi
          sudo -u run env -i "${UENV[@]}" rustdesk --server > /tmp/rustdesk.log 2>&1 &
          NODE="gh-${OS_LABEL//./-}-$GITHUB_RUN_ID"
          ACCESS_TOKEN=$(printf 'data = "client_id=%s&client_secret=%s"\n' "$TS_OAUTH_CLIENT_ID" "$TS_OAUTH_CLIENT_SECRET" \
            | curl -fsS -K - "https://api.tailscale.com/api/v2/oauth/token" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])") \
            || { echo "::error::Tailscale OAuth token request failed"; exit 1; }
          echo "::add-mask::$ACCESS_TOKEN"
          TS_KEY=$(printf 'header = "Authorization: Bearer %s"\n' "$ACCESS_TOKEN" \
            | curl -fsS -K - -H "Content-Type: application/json" \
              -d '{"capabilities":{"devices":{"create":{"reusable":false,"ephemeral":true,"preauthorized":true,"tags":["tag:ci"]}}},"expirySeconds":600}' \
              "https://api.tailscale.com/api/v2/tailnet/-/keys" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['key'])") \
            || { echo "::error::Tailscale auth key request failed - check the OAuth client scope and tag:ci"; exit 1; }
          echo "::add-mask::$TS_KEY"
          curl -fsSL -o "$RUNNER_TEMP/tailscale-install.sh" https://tailscale.com/install.sh
          sh "$RUNNER_TEMP/tailscale-install.sh"
          sudo tailscale up --authkey="$TS_KEY" --hostname="$NODE" --timeout=120s
          TS_IP=$(tailscale ip -4 2>/dev/null || true)
          if [ -z "$TS_IP" ]; then echo "::error::Tailscale IP not assigned"; exit 1; fi
          for i in $(seq 1 60); do
            RD_OUT=$(sudo rustdesk --password "$RUN_PASSWORD" 2>&1 || true)
            case "$RD_OUT" in *Done!*) break ;; esac
            sleep 3
          done
          case "$RD_OUT" in *Done!*) ;; *) echo "::error::RustDesk did not accept the password: $RD_OUT"; tail -n 40 /tmp/rustdesk.log; exit 1 ;; esac
          sudo rustdesk --option direct-server Y
          sudo rustdesk --option whitelist 100.64.0.0/10
          sudo rustdesk --option verification-method use-permanent-password
          sudo rustdesk --option approve-mode password
          RD_UP=no
          for i in $(seq 1 30); do if timeout 5 bash -c "cat < /dev/null > /dev/tcp/$TS_IP/21118" 2>/dev/null; then RD_UP=yes; break; fi; sleep 2; done
          if [ "$RD_UP" != yes ]; then echo "::error::RustDesk port 21118 not reachable"; tail -n 40 /tmp/rustdesk.log; exit 1; fi
          echo "TCP OK"
          echo "=== READY ==="
          exec env -i PATH="$PATH" HOME="$HOME" bash -c 'while true; do echo "[$(date)] Active"; sleep 300; done'
  windows:
    needs: select-os
    if: needs.select-os.outputs.windows != '[]'
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.select-os.outputs.windows) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    env:
      OS_LABEL: ${{ matrix.os }}
      RUN_PASSWORD: ${{ secrets.RUN_PASSWORD }}
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_CLIENT_SECRET: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
    steps:
      - name: build
        run: |
          if ([string]::IsNullOrEmpty($env:RUN_PASSWORD) -or $env:RUN_PASSWORD.Length -lt 12) { Write-Error "RUN_PASSWORD must be set and at least 12 characters"; exit 1 }
          netsh advfirewall firewall delete rule name="RDP-Tailscale" | Out-Null
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389 remoteip=100.64.0.0/10
          Disable-NetFirewallRule -DisplayGroup 'Remote Desktop' -ErrorAction SilentlyContinue
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 2 -Force
          Restart-Service -Name TermService -Force
          $securePass = ConvertTo-SecureString $env:RUN_PASSWORD -AsPlainText -Force
          New-LocalUser -Name "run" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "run"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "run"
          $arch = if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString() -eq 'Arm64') { 'arm64' } else { 'amd64' }
          $rdTag = '1.5.0'
          try {
            $rdFinal = (Invoke-WebRequest -Uri 'https://github.com/rustdesk/rustdesk/releases/latest' -Method Head -UseBasicParsing).BaseResponse.RequestMessage.RequestUri.AbsoluteUri.TrimEnd('/').Split('/')[-1]
            if ($rdFinal -match '^\d+\.\d+\.\d+$') { $rdTag = $rdFinal }
          } catch {}
          $rdArch = if ($arch -eq 'arm64') { 'aarch64' } else { 'x86_64' }
          $rdSetup = "$env:TEMP\rustdesk-setup.exe"
          Invoke-WebRequest -Uri "https://github.com/rustdesk/rustdesk/releases/download/$rdTag/rustdesk-$rdTag-$rdArch.exe" -OutFile $rdSetup
          Start-Process -FilePath $rdSetup -ArgumentList '--silent-install'
          $msi = "$env:TEMP\tailscale.msi"
          try {
            Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-$arch.msi" -OutFile $msi
          } catch {
            $page = (Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/" -UseBasicParsing).Content
            $ver = [regex]::Match($page, "tailscale-setup-([0-9.]+)-$arch\.msi").Groups[1].Value
            if (-not $ver) { Write-Error "Could not resolve Tailscale installer"; exit 1 }
            Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-$ver-$arch.msi" -OutFile $msi
          }
          $sig = Get-AuthenticodeSignature $msi
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Tailscale') { Write-Error "Tailscale installer signature check failed: $($sig.Status)"; exit 1 }
          $p = Start-Process msiexec.exe -ArgumentList "/i", "`"$msi`"", "/quiet", "/norestart" -Wait -PassThru
          if ($p.ExitCode -notin @(0, 3010)) { Write-Error "Tailscale install failed: exit code $($p.ExitCode)"; exit 1 }
          Remove-Item $msi -Force
          Start-Service Tailscale -ErrorAction SilentlyContinue
          $ts = @($env:ProgramFiles, ${env:ProgramFiles(x86)}, $env:ProgramW6432) | Where-Object { $_ } | ForEach-Object { Join-Path $_ 'Tailscale\tailscale.exe' } | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $ts) { Write-Error "tailscale.exe not found"; exit 1 }
          $tokenBody = "client_id=$([uri]::EscapeDataString($env:TS_OAUTH_CLIENT_ID))&client_secret=$([uri]::EscapeDataString($env:TS_OAUTH_CLIENT_SECRET))"
          $tokenResp = Invoke-RestMethod -Method Post -Uri "https://api.tailscale.com/api/v2/oauth/token" -ContentType "application/x-www-form-urlencoded" -Body $tokenBody
          Write-Host "::add-mask::$($tokenResp.access_token)"
          $keyBody = @{ capabilities = @{ devices = @{ create = @{ reusable = $false; ephemeral = $true; preauthorized = $true; tags = @("tag:ci") } } }; expirySeconds = 600 } | ConvertTo-Json -Depth 5
          $keyResp = Invoke-RestMethod -Method Post -Uri "https://api.tailscale.com/api/v2/tailnet/-/keys" -Headers @{ Authorization = "Bearer $($tokenResp.access_token)" } -ContentType "application/json" -Body $keyBody
          Write-Host "::add-mask::$($keyResp.key)"
          $tsName = "gh-$($env:OS_LABEL.Replace('.', '-'))-$env:GITHUB_RUN_ID"
          & $ts up --authkey=$($keyResp.key) --hostname=$tsName --unattended --timeout=120s
          $tsIP = $null; $retries = 0
          while (-not $tsIP -and $retries -lt 12) { $tsIP = & $ts ip -4; Start-Sleep -Seconds 5; $retries++ }
          if (-not $tsIP) { & $ts status; Get-Service Tailscale -ErrorAction SilentlyContinue | Out-Host; Write-Error "Tailscale IP not assigned"; exit 1 }
          $test = Test-NetConnection -ComputerName $tsIP -Port 3389
          if (-not $test.TcpTestSucceeded) { Write-Error "Port not reachable"; exit 1 }
          $rd = Join-Path $(if ($env:ProgramW6432) { $env:ProgramW6432 } else { $env:ProgramFiles }) 'RustDesk\rustdesk.exe'
          $rdEnd = (Get-Date).AddMinutes(5)
          while (-not (Test-Path $rd)) { if ((Get-Date) -gt $rdEnd) { Write-Error "RustDesk did not finish installing"; exit 1 }; Start-Sleep -Seconds 3 }
          $rdEnd = (Get-Date).AddMinutes(5)
          while ($true) {
            $rdOut = (& $rd --password $env:RUN_PASSWORD | Out-String)
            if ($rdOut -match 'Done!') { break }
            if ((Get-Date) -gt $rdEnd) { Write-Error "RustDesk did not accept the password: $rdOut"; exit 1 }
            Start-Sleep -Seconds 3
          }
          & $rd --option direct-server Y | Out-Null
          & $rd --option whitelist 100.64.0.0/10 | Out-Null
          & $rd --option verification-method use-permanent-password | Out-Null
          & $rd --option approve-mode password | Out-Null
          netsh advfirewall firewall delete rule name="RustDesk-Tailscale" | Out-Null
          netsh advfirewall firewall add rule name="RustDesk-Tailscale" dir=in action=allow protocol=TCP localport=21118 remoteip=100.64.0.0/10
          netsh advfirewall firewall set rule name="RustDesk Service" dir=in new remoteip=100.64.0.0/10
          $rdEnd = (Get-Date).AddMinutes(2)
          while (-not (Test-NetConnection -ComputerName $tsIP -Port 21118 -InformationLevel Quiet -WarningAction SilentlyContinue)) { if ((Get-Date) -gt $rdEnd) { Write-Error "RustDesk port 21118 not reachable"; exit 1 }; Start-Sleep -Seconds 3 }
          Write-Host "=== READY ==="
          Remove-Item Env:RUN_PASSWORD, Env:TS_OAUTH_CLIENT_ID, Env:TS_OAUTH_CLIENT_SECRET -ErrorAction SilentlyContinue
          Remove-Variable securePass, tokenBody, tokenResp, keyBody, keyResp -ErrorAction SilentlyContinue
          while ($true) { Write-Host "[$(Get-Date)] Active"; Start-Sleep -Seconds 300 }
  macos:
    needs: select-os
    if: needs.select-os.outputs.macos != '[]'
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.select-os.outputs.macos) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    env:
      OS_LABEL: ${{ matrix.os }}
      RUN_PASSWORD: ${{ secrets.RUN_PASSWORD }}
      VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_CLIENT_SECRET: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
    steps:
      - name: build
        shell: bash
        run: |
          if [ "${#RUN_PASSWORD}" -lt 12 ]; then echo "::error::RUN_PASSWORD must be set and at least 12 characters"; exit 1; fi
          if [ -z "$VNC_PASSWORD" ]; then echo "::error::VNC_PASSWORD not set (max 8 chars)"; exit 1; fi
          if [ "$(printf "%s" "$VNC_PASSWORD" | wc -c | tr -d ' ')" -gt 8 ]; then echo "::error::VNC_PASSWORD must be 8 chars or fewer"; exit 1; fi
          sudo sysadminctl -addUser run -fullName "Run" -password "$RUN_PASSWORD" -admin
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -configure -clientopts -setvnclegacy -vnclegacy yes -setvncpw -vncpw "$VNC_PASSWORD"
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on -users run -privs -all -restart -agent
          TCC_DB="/Library/Application Support/com.apple.TCC/TCC.db"
          for SERVICE in "kTCCServiceScreenCapture" "kTCCServiceAccessibility" "kTCCServicePostEvent" "kTCCServiceListenEvent"; do
            for CLIENT in "com.apple.RemoteDesktopAgent" "com.apple.screensharing.agent" "com.carriez.rustdesk"; do
              sudo sqlite3 "$TCC_DB" "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version) VALUES ('$SERVICE', '$CLIENT', 0, 2, 4, 1);" \
                || { echo "::error::Could not write the screen-sharing permissions (TCC) - this macOS image may block it"; exit 1; }
            done
          done
          env -i /usr/bin/caffeinate -dimsu > /dev/null 2>&1 &
          RD_TAG=$(curl -fsSIL -o /dev/null -w '%{url_effective}' https://github.com/rustdesk/rustdesk/releases/latest || true)
          RD_TAG=${RD_TAG##*/}
          case "$RD_TAG" in [0-9]*.[0-9]*.[0-9]*) ;; *) RD_TAG=1.5.0 ;; esac
          case "$(uname -m)" in arm64) RD_ARCH=aarch64 ;; *) RD_ARCH=x86_64 ;; esac
          curl -fsSL -o /tmp/rustdesk.dmg "https://github.com/rustdesk/rustdesk/releases/download/$RD_TAG/rustdesk-$RD_TAG-$RD_ARCH.dmg" \
            || { echo "::error::Could not download RustDesk $RD_TAG"; exit 1; }
          mkdir -p /tmp/rdmnt
          hdiutil attach /tmp/rustdesk.dmg -nobrowse -quiet -mountpoint /tmp/rdmnt <<< Y
          sudo ditto /tmp/rdmnt/RustDesk.app /Applications/RustDesk.app
          hdiutil detach /tmp/rdmnt -quiet
          open /Applications/RustDesk.app
          NODE="gh-${OS_LABEL//./-}-$GITHUB_RUN_ID"
          ACCESS_TOKEN=$(printf 'data = "client_id=%s&client_secret=%s"\n' "$TS_OAUTH_CLIENT_ID" "$TS_OAUTH_CLIENT_SECRET" \
            | curl -fsS -K - "https://api.tailscale.com/api/v2/oauth/token" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])") \
            || { echo "::error::Tailscale OAuth token request failed"; exit 1; }
          echo "::add-mask::$ACCESS_TOKEN"
          TS_KEY=$(printf 'header = "Authorization: Bearer %s"\n' "$ACCESS_TOKEN" \
            | curl -fsS -K - -H "Content-Type: application/json" \
              -d '{"capabilities":{"devices":{"create":{"reusable":false,"ephemeral":true,"preauthorized":true,"tags":["tag:ci"]}}},"expirySeconds":600}' \
              "https://api.tailscale.com/api/v2/tailnet/-/keys" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['key'])") \
            || { echo "::error::Tailscale auth key request failed - check the OAuth client scope and tag:ci"; exit 1; }
          echo "::add-mask::$TS_KEY"
          brew install tailscale
          sudo tailscaled >/dev/null 2>&1 &
          for i in $(seq 1 30); do if [ -S /var/run/tailscaled.socket ]; then break; fi; sleep 1; done
          sudo tailscale up --authkey="$TS_KEY" --hostname="$NODE" --timeout=120s
          TS_IP=$(tailscale ip -4 2>/dev/null || true)
          if [ -z "$TS_IP" ]; then echo "::error::Tailscale IP not assigned"; exit 1; fi
          RD=/Applications/RustDesk.app/Contents/MacOS/RustDesk
          for i in $(seq 1 100); do
            RD_OUT=$(sudo "$RD" --password "$RUN_PASSWORD" 2>&1 || true)
            case "$RD_OUT" in *Done!*) break ;; esac
            sleep 3
          done
          case "$RD_OUT" in *Done!*) ;; *) echo "::error::RustDesk did not accept the password: $RD_OUT"; exit 1 ;; esac
          sudo "$RD" --option direct-server Y
          sudo "$RD" --option whitelist 100.64.0.0/10
          sudo "$RD" --option verification-method use-permanent-password
          sudo "$RD" --option approve-mode password
          RD_UP=no
          for i in $(seq 1 30); do if (echo > "/dev/tcp/$TS_IP/21118") 2>/dev/null; then RD_UP=yes; break; fi; sleep 2; done
          if [ "$RD_UP" != yes ]; then echo "::error::RustDesk port 21118 not reachable"; exit 1; fi
          SCREEN_USER=$(stat -f%Su /dev/console || true)
          if [ -z "$SCREEN_USER" ] || [ "$SCREEN_USER" = root ]; then SCREEN_USER=$(id -un); fi
          if sudo dscl . -passwd "/Users/$SCREEN_USER" "$RUN_PASSWORD" && sudo dscl . -authonly "$SCREEN_USER" "$RUN_PASSWORD"; then
            echo "The account on screen ($SCREEN_USER) now uses the same password as run"
          else
            echo "::warning::Could not set the password of the account on screen ($SCREEN_USER). In password boxes type run as the name and your password"
          fi
          echo "=== READY ==="
          exec env -i PATH="$PATH" HOME="$HOME" bash -c 'while true; do echo "[$(date)] Active"; sleep 300; done'
